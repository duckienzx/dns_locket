<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Locket VIP Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090a0f;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Hiệu ứng đốm sáng nền */
        .glow-bg {
            position: absolute;
            width: 350px;
            height: 350px;
            background: linear-gradient(135deg, #ff007a, #7928ca);
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: pulse 6s infinite alternate;
        }

        .glow-bg-2 {
            position: absolute;
            bottom: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.4;
            animation: pulse 8s infinite alternate-reverse;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(20px, -20px); }
        }

        /* Khung Card chính Glassmorphism */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background: linear-gradient(90deg, rgba(255, 0, 122, 0.2), rgba(121, 40, 202, 0.2));
            border: 1px solid rgba(255, 0, 122, 0.4);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: #ff73b3;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #a5a5a5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 14px;
            color: #a0a5b5;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        input::placeholder {
            color: #636b7b;
        }

        /* Nút bấm sang trọng */
        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #000;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.5);
            background: linear-gradient(135deg, #38f9d7 0%, #4facfe 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 24px;
            font-size: 12px;
            color: #525a6b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>
    <div class="glow-bg-2"></div>

    <div class="container">
        <span class="badge">VIP Profile Service</span>
        <h1>Tạo DNS Locket</h1>
        <p class="subtitle">Nhập tên để kích hoạt file cấu hình cá nhân hóa độc quyền</p>

        <div class="input-group">
            <input type="text" id="username" placeholder="Nhập tên của bạn (Ví dụ: Huy)..." autocomplete="off">
        </div>

        <button class="btn-submit" onclick="generateProfile()">
            <span>TẢI CẤU HÌNH NGAY</span>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        </button>

        <div class="footer-note">
            🔒 Mở bằng <b>Safari</b> trên iPhone để tự động nhận profile
        </div>
    </div>

<script>
function generateProfile() {
    const nameInput = document.getElementById('username').value.trim();
    if (!nameInput) {
        alert("Vui lòng nhập tên của bạn trước khi tải!");
        return;
    }

    const dnsId = "a722c29a2e"; // ID NextDNS của bạn
    const name = nameInput;

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16).toUpperCase();
        });
    }

    const uuid1 = generateUUID();
    const uuid2 = generateUUID();

    const xmlContent = `<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
  <dict>
    <key>PayloadDisplayName</key>
    <string>DNS Huy Hiệu · ${name}</string>
    <key>PayloadDescription</key>
    <string>Cấu hình DNS Huy Hiệu dành cho tài khoản Locket ${name}.</string>
    <key>PayloadIdentifier</key>
    <string>io.nextdns.${dnsId}.profile</string>
    <key>PayloadScope</key>
    <string>System</string>
    <key>PayloadType</key>
    <string>Configuration</string>
    <key>PayloadUUID</key>
    <string>${uuid1}</string>
    <key>PayloadVersion</key>
    <integer>1</integer>
    <key>PayloadContent</key>
    <array>
      <dict>
        <key>DNSSettings</key>
        <dict>
          <key>DNSProtocol</key>
          <string>HTTPS</string>
          <key>ServerURL</key>
          <string>https://apple.dns.nextdns.io/${dnsId}</string>
        </dict>
        <key>OnDemandRules</key>
        <array>
          <dict>
            <key>Action</key>
            <string>EvaluateConnection</string>
            <key>ActionParameters</key>
            <array>
              <dict>
                <key>DomainAction</key>
                <string>NeverConnect</string>
                <key>Domains</key>
                <array>
                  <string>captive.apple.com</string>
                  <string>3gppnetwork.org</string>
                  <string>dav.orange.fr</string>
                  <string>vvm.mobistar.be</string>
                  <string>vvm.mstore.msg.t-mobile.com</string>
                  <string>tma.vvm.mone.pan-net.eu</string>
                  <string>vvm.ee.co.uk</string>
                </array>
              </dict>
            </array>
          </dict>
          <dict>
            <key>Action</key>
            <string>Connect</string>
          </dict>
        </array>
        <key>PayloadType</key>
        <string>com.apple.dnsSettings.managed</string>
        <key>PayloadIdentifier</key>
        <string>io.nextdns.${dnsId}.profile.dnsSettings.managed</string>
        <key>PayloadUUID</key>
        <string>${uuid2}</string>
        <key>PayloadDisplayName</key>
        <string>DNS Huy Hiệu · ${name}</string>
        <key>PayloadOrganization</key>
        <string>NextDNS</string>
        <key>PayloadVersion</key>
        <integer>1</integer>
      </dict>
    </array>
  </dict>
</plist>`;

    const blob = new Blob([xmlContent], { type: 'application/x-apple-asymmetric-key-exchange' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `DNS_HuyHieu_${name}.mobileconfig`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
